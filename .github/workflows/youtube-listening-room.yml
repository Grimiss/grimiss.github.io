name: Listening Room YouTube sync

on:
  schedule:
    - cron: '5 17 * * *'
      timezone: Europe/Copenhagen
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check YouTube without changing the site (leave checked for review)
        type: boolean
        default: true
  pull_request:
    paths:
      - 'listening-room.html'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/youtube-listening-room.yml'
  push:
    paths:
      - 'listening-room.html'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/youtube-listening-room.yml'

permissions:
  contents: read

concurrency:
  group: listening-room-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/player.test.cjs

  sync:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify write target
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$DRY_RUN" = true ]; then
            exit 0
          fi
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
      - name: Discover and add releases (or dry-run)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            python scripts/sync_youtube.py --dry-run
          else
            python scripts/sync_youtube.py
          fi
      - name: Commit only a changed collection
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: |
          if git diff --quiet -- listening-room.html; then
            echo 'No new eligible releases; no commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- listening-room.html
            git commit -m 'Add new ambient releases to Listening Room'
            # No force/rebase: concurrent manual changes reject this push safely.
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Publish through existing Pages setup (retry an unpublished commit too)
        if: github.event_name == 'schedule' || inputs.dry_run == false
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/request_pages_build.py
